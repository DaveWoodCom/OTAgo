---
name: CI

on:
  push:
    branches: [main, qa, develop, "feature/**"]
  pull_request:
    branches: [main, qa, develop]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    # Lives in .github/workflows so the same file runs on GitHub Actions and on Forgejo (which
    # falls back to this directory when .forgejo/workflows is absent). `ubuntu-latest` is a label
    # the Forgejo runners are registered with; the job itself runs inside the PHP image below.
    runs-on: ubuntu-latest
    container:
      image: php:${{ matrix.php }}-cli
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    steps:
      # The official php images ship without git or node, so the checkout is done by hand
      # (actions/checkout is a JavaScript action and needs node in the container).
      - name: Install git, unzip and Composer
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git unzip ca-certificates
          curl -sS https://getcomposer.org/installer | php -- --quiet --install-dir=/usr/local/bin --filename=composer
          composer --version

      - name: Check out ${{ github.sha }}
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "$REPO_URL"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Lint every tracked PHP file
        run: git ls-files '*.php' | xargs -n1 php -l

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Run the test suite
        run: composer test
